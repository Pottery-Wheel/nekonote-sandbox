<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>統計値の計算ツール</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; height: 6rem; }
      .error { color: #b00020; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: 0.75rem; margin: 1rem 0 0; }
      .card { border: 1px solid #ccc; padding: 0.5rem 0.75rem; }
      .card dt { margin: 0; }
      .card dd { margin: 0.25rem 0 0; font-size: 1.5rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <h1>統計値の計算ツール</h1>
    <p>数値をカンマか空白で区切って入力してください。（例：4 8 15）</p>
    <textarea id="values">4 8 15 16 23 42</textarea>
    <p><button id="calc" type="button">計算する</button></p>
    <p>計算結果は、入力した数値から計算した統計値です。</p>
    <div id="result"></div>
    <script type="module">
      import { describe } from "./src/stats.js";

      const LABELS = {
        count: "件数", sum: "合計", mean: "平均値", median: "中央値", mode: "最頻値",
        min: "最小値", max: "最大値", range: "範囲", variance: "分散", stdDev: "標準偏差",
        q1: "第1四分位数", q3: "第3四分位数", cv: "変動係数",
      };

      function show() {
        const result = document.getElementById("result");
        result.replaceChildren();
        const text = document.getElementById("values").value.trim();
        if (text === "") {
          const message = document.createElement("p");
          message.className = "error";
          message.textContent = "数値を入力してください";
          result.append(message);
          return;
        }
        const values = text.split(/[\s,]+/).map(Number);
        try {
          const stats = describe(values);
          const cards = document.createElement("dl");
          cards.className = "cards";
          for (const [key, value] of Object.entries(stats)) {
            if (key === "iqr") continue;
            const card = document.createElement("div");
            card.className = "card";
            const term = document.createElement("dt");
            term.textContent = LABELS[key] ?? key;
            const detail = document.createElement("dd");
            detail.textContent = Array.isArray(value) ? value.join(", ") : String(value);
            card.append(term, detail);
            cards.append(card);
          }
          result.append(cards);
        } catch (error) {
          const message = document.createElement("p");
          message.className = "error";
          message.textContent = error.message;
          result.append(message);
        }
      }

      document.getElementById("calc").addEventListener("click", show);
      show();
    </script>
    <p>入力した数値は、このページの中だけで計算し、外部には送りません。</p>
  </body>
</html>
