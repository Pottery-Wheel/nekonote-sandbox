<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>統計値の計算ツール</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; height: 6rem; }
      table { border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #ccc; padding: 0.25rem 0.75rem; text-align: left; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>統計値の計算ツール</h1>
    <p>数値をカンマか空白で区切って入力してください。</p>
    <textarea id="values">4 8 15 16 23 42</textarea>
    <p><button id="calc" type="button">計算する</button></p>
    <div id="result"></div>
    <script type="module">
      import { describe } from "./src/stats.js";

      const LABELS = {
        count: "件数", sum: "合計", mean: "平均値", median: "中央値", mode: "最頻値",
        min: "最小値", max: "最大値", range: "範囲", variance: "分散", stdDev: "標準偏差",
        q1: "第1四分位数", q3: "第3四分位数", cv: "変動係数",
      };

      function show() {
        const result = document.getElementById("result");
        result.replaceChildren();
        const text = document.getElementById("values").value.trim();
        const values = text === "" ? [] : text.split(/[\s,]+/).map(Number);
        try {
          const stats = describe(values);
          const table = document.createElement("table");
          for (const [key, value] of Object.entries(stats)) {
            const row = table.insertRow();
            row.insertCell().textContent = LABELS[key] ?? key;
            row.insertCell().textContent = Array.isArray(value) ? value.join(", ") : String(value);
          }
          result.append(table);
        } catch (error) {
          const message = document.createElement("p");
          message.className = "error";
          message.textContent = error.message;
          result.append(message);
        }
      }

      document.getElementById("calc").addEventListener("click", show);
      show();
    </script>
  </body>
</html>
